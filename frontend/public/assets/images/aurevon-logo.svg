<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="auroraGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Outer Hexagonal Frame -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" 
           stroke="url(#auroraGrad)" stroke-width="3" stroke-linejoin="round" fill="#11141a" fill-opacity="0.8"/>
  <!-- Internal Convergent Facets -->
  <polygon points="50,22 76,37 76,63 50,78 24,63 24,37" 
           stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>
  <!-- Central Diamond Core -->
  <polygon points="50,34 64,50 50,66 36,50" 
           fill="url(#coreGlow)" stroke="#c7d2fe" stroke-width="1.5"/>
  <!-- Accent Nodes -->
  <circle cx="50" cy="22" r="2.5" fill="#c7d2fe"/>
  <circle cx="76" cy="37" r="2.5" fill="#818cf8"/>
  <circle cx="76" cy="63" r="2.5" fill="#6366f1"/>
  <circle cx="50" cy="78" r="2.5" fill="#4f46e5"/>
  <circle cx="24" cy="63" r="2.5" fill="#6366f1"/>
  <circle cx="24" cy="37" r="2.5" fill="#818cf8"/>
</svg>
